name: EbeeAI Release

on:
  push:
    tags:
      - 'v*_*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.127_0.0.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: sub2api-ebeeai

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.parse.outputs.tag_name }}
      release_version: ${{ steps.parse.outputs.release_version }}
      upstream_version: ${{ steps.parse.outputs.upstream_version }}
      ebeeai_version: ${{ steps.parse.outputs.ebeeai_version }}
      sync_branch: ${{ steps.parse.outputs.sync_branch }}
    steps:
      - name: Parse release tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+_[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected tag format v<upstream>_<ebeeai>, got: $TAG_NAME"
            exit 1
          fi

          RELEASE_VERSION="${TAG_NAME#v}"
          UPSTREAM_VERSION="${RELEASE_VERSION%%_*}"
          EBEEAI_VERSION="${RELEASE_VERSION#*_}"

          {
            echo "tag_name=${TAG_NAME}"
            echo "release_version=${RELEASE_VERSION}"
            echo "upstream_version=${UPSTREAM_VERSION}"
            echo "ebeeai_version=${EBEEAI_VERSION}"
            echo "sync_branch=release/v${UPSTREAM_VERSION}"
          } >> "${GITHUB_OUTPUT}"

          echo "Tag: ${TAG_NAME}"
          echo "Upstream version: ${UPSTREAM_VERSION}"
          echo "EbeeAI version: ${EBEEAI_VERSION}"

  update-version:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update VERSION file
        run: |
          echo "${{ needs.resolve-version.outputs.upstream_version }}" > backend/cmd/server/VERSION
          echo "Updated VERSION file to: $(cat backend/cmd/server/VERSION)"

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v7
        with:
          name: ebeeai-version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  release:
    needs: [resolve-version, update-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-version.outputs.tag_name }}

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: ebeeai-version-file
          path: backend/cmd/server/

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          commit="$(git rev-parse --short=12 HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version="${{ needs.resolve-version.outputs.release_version }}"
          upstream="${{ needs.resolve-version.outputs.upstream_version }}"

          tags="${image}-backend:sha-${commit}"
          tags="${tags}"$'\n'"${image}-backend:${version}"
          tags="${tags}"$'\n'"${image}-backend:${upstream}"
          tags="${tags}"$'\n'"${image}-backend:latest"
          tags="${tags}"$'\n'"${image}-app:sha-${commit}"
          tags="${tags}"$'\n'"${image}-app:${version}"
          tags="${tags}"$'\n'"${image}-app:${upstream}"
          tags="${tags}"$'\n'"${image}-app:latest"
          tags="${tags}"$'\n'"${image}-docs:sha-${commit}"
          tags="${tags}"$'\n'"${image}-docs:${version}"
          tags="${tags}"$'\n'"${image}-docs:${upstream}"
          tags="${tags}"$'\n'"${image}-docs:latest"
          tags="${tags}"$'\n'"${image}-gateway:sha-${commit}"
          tags="${tags}"$'\n'"${image}-gateway:${version}"
          tags="${tags}"$'\n'"${image}-gateway:${upstream}"
          tags="${tags}"$'\n'"${image}-gateway:latest"

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "upstream=${upstream}"
            echo "commit=${commit}"
            echo "build_date=${build_date}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Fetch tags with annotations
        run: git fetch --tags --force

      - name: Get tag message
        id: tag_message
        shell: bash
        run: |
          TAG_NAME='${{ needs.resolve-version.outputs.tag_name }}'
          TAG_MESSAGE="$(git tag -l --format='%(contents:body)' "$TAG_NAME")"

          echo "message<<EOF" >> "${GITHUB_OUTPUT}"
          echo "${TAG_MESSAGE}" >> "${GITHUB_OUTPUT}"
          echo "EOF" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy_ebeeai/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-backend:sha-${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.image }}-backend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}-backend:${{ steps.meta.outputs.upstream }}
            ${{ steps.meta.outputs.image }}-backend:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.upstream }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.build_date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=ebeeai-release-backend
          cache-to: type=gha,scope=ebeeai-release-backend,mode=max
          labels: |
            org.opencontainers.image.title=sub2api-ebeeai-backend
            org.opencontainers.image.description=Sub2API backend for the EbeeAI split deployment
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy_ebeeai/Dockerfile.frontend_self
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-app:sha-${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.image }}-app:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}-app:${{ steps.meta.outputs.upstream }}
            ${{ steps.meta.outputs.image }}-app:latest
          cache-from: type=gha,scope=ebeeai-release-app
          cache-to: type=gha,scope=ebeeai-release-app,mode=max
          labels: |
            org.opencontainers.image.title=sub2api-ebeeai-app
            org.opencontainers.image.description=EbeeAI app SPA for the split deployment
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}

      - name: Build and push docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy_ebeeai/Dockerfile.frontend_docs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-docs:sha-${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.image }}-docs:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}-docs:${{ steps.meta.outputs.upstream }}
            ${{ steps.meta.outputs.image }}-docs:latest
          cache-from: type=gha,scope=ebeeai-release-docs
          cache-to: type=gha,scope=ebeeai-release-docs,mode=max
          labels: |
            org.opencontainers.image.title=sub2api-ebeeai-docs
            org.opencontainers.image.description=EbeeAI marketing site and docs for the split deployment
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy_ebeeai/Dockerfile.gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-gateway:sha-${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.image }}-gateway:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}-gateway:${{ steps.meta.outputs.upstream }}
            ${{ steps.meta.outputs.image }}-gateway:latest
          cache-from: type=gha,scope=ebeeai-release-gateway
          cache-to: type=gha,scope=ebeeai-release-gateway,mode=max
          labels: |
            org.opencontainers.image.title=sub2api-ebeeai-gateway
            org.opencontainers.image.description=Path router for the EbeeAI split deployment
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-version.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          UPSTREAM_VERSION: ${{ needs.resolve-version.outputs.upstream_version }}
          EBEEAI_VERSION: ${{ needs.resolve-version.outputs.ebeeai_version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
        shell: bash
        run: |
          set -euo pipefail

          BODY_FILE="$(mktemp)"
          {
            echo "> EbeeAI Sub2API release built from \`frontend_self/\`, \`frontend_docs/\`, and \`deploy_ebeeai/\`."
            echo
            echo "- Upstream Sub2API version: \`${UPSTREAM_VERSION}\`"
            echo "- EbeeAI service version: \`${EBEEAI_VERSION}\`"
            echo
            if [ -n "${TAG_MESSAGE}" ]; then
              echo "${TAG_MESSAGE}"
              echo
            fi
            echo "## Docker (split stack)"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}-backend:${RELEASE_VERSION}"
            echo "docker pull ${IMAGE}-app:${RELEASE_VERSION}"
            echo "docker pull ${IMAGE}-docs:${RELEASE_VERSION}"
            echo "docker pull ${IMAGE}-gateway:${RELEASE_VERSION}"
            echo '```'
            echo
            echo "## 1Panel"
            echo
            echo "Set \`SUB2API_VERSION=${RELEASE_VERSION}\` in the EbeeAI compose environment, then pull and recreate the stack (gateway + backend + app + docs)."
          } > "${BODY_FILE}"

          gh release view "${TAG_NAME}" >/dev/null 2>&1 && \
            gh release delete "${TAG_NAME}" --yes --cleanup-tag=false || true

          gh release create "${TAG_NAME}" \
            --title "EbeeAI ${RELEASE_VERSION}" \
            --notes-file "${BODY_FILE}"

      - name: Print image tags
        run: |
          echo '${{ steps.meta.outputs.tags }}'

  sync-version-file:
    needs: [resolve-version, release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.sync_branch }}

      - name: Sync VERSION file to sync branch
        env:
          UPSTREAM_VERSION: ${{ needs.resolve-version.outputs.upstream_version }}
          SYNC_BRANCH: ${{ needs.resolve-version.outputs.sync_branch }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION || true)"
          if [ "${CURRENT_VERSION}" = "${UPSTREAM_VERSION}" ]; then
            echo "VERSION file already matches ${UPSTREAM_VERSION}"
            exit 0
          fi

          echo "${UPSTREAM_VERSION}" > backend/cmd/server/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${UPSTREAM_VERSION} [skip ci]"
          git push origin HEAD:${SYNC_BRANCH}

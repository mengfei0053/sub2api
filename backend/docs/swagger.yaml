basePath: /
host: localhost:8080
info:
  contact:
    name: Sub2API
    url: https://sub2api.org
  description: Sub2API REST API and AI gateway (Claude / OpenAI / Gemini compatible).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://sub2api.org
  title: Sub2API API
  version: 0.1.133
paths:
  /api/v1/admin/dashboard/overview:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Admin dashboard
      tags:
      - admin
  /api/v1/admin/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - admin
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Refresh token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Register
      tags:
      - auth
  /api/v1/keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - keys
    post:
      consumes:
      - application/json
      parameters:
      - description: Create key payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - keys
  /api/v1/payment/orders:
    post:
      consumes:
      - application/json
      parameters:
      - description: Order payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create payment order
      tags:
      - payment
  /api/v1/payment/plans:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: List subscription plans
      tags:
      - payment
  /api/v1/settings/public:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Public site settings
      tags:
      - settings
  /api/v1/user/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - user
  /health:
    get:
      description: Returns service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /setup/status:
    get:
      description: Returns whether initial setup is required
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Setup status
      tags:
      - setup
  /v1/chat/completions:
    post:
      consumes:
      - application/json
      parameters:
      - description: Chat completion request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - APIKeyAuth: []
      summary: OpenAI chat completions
      tags:
      - gateway
  /v1/messages:
    post:
      consumes:
      - application/json
      description: Claude / Anthropic Messages API compatible endpoint
      parameters:
      - description: Messages request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - APIKeyAuth: []
      summary: Anthropic-compatible messages
      tags:
      - gateway
  /v1/models:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - APIKeyAuth: []
      summary: List models
      tags:
      - gateway
  /v1/usage:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - APIKeyAuth: []
      summary: Usage statistics
      tags:
      - gateway
  /v1beta/models:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - APIKeyAuth: []
      summary: List Gemini models
      tags:
      - gateway
securityDefinitions:
  APIKeyAuth:
    description: API key for AI gateway (`Bearer sk-...`)
    in: header
    name: Authorization
    type: apiKey
  BearerAuth:
    description: JWT token for console API (`Bearer <token>`)
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

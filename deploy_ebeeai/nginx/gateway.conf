map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream sub2api_backend {
    server backend:8080;
}

upstream sub2api_frontend_self {
    server frontend_self:80;
}

upstream sub2api_frontend_docs {
    server frontend_docs:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # --- Backend API (must win over frontend routes) ---
    location = /health {
        proxy_pass http://sub2api_backend;
    }

    location ^~ /api/ {
        proxy_pass http://sub2api_backend;
    }

    location ^~ /v1/ {
        proxy_pass http://sub2api_backend;
    }

    location ^~ /v1beta/ {
        proxy_pass http://sub2api_backend;
    }

    location ^~ /backend-api/ {
        proxy_pass http://sub2api_backend;
    }

    location ^~ /antigravity/ {
        proxy_pass http://sub2api_backend;
    }

    location ^~ /setup/ {
        proxy_pass http://sub2api_backend;
    }

    location ^~ /swagger {
        if ($host !~* ^(\[::1\]|127\.0\.0\.1|localhost)(:[0-9]+)?$) {
            return 403;
        }
        proxy_pass http://sub2api_backend;
    }

    location = /responses {
        proxy_pass http://sub2api_backend;
    }

    location ^~ /responses/ {
        proxy_pass http://sub2api_backend;
    }

    location = /chat/completions {
        proxy_pass http://sub2api_backend;
    }

    location = /embeddings {
        proxy_pass http://sub2api_backend;
    }

    location ^~ /images/generations {
        proxy_pass http://sub2api_backend;
    }

    location ^~ /images/edits {
        proxy_pass http://sub2api_backend;
    }

    # --- Marketing site + docs (frontend_docs) ---
    location = / {
        proxy_pass http://sub2api_frontend_docs;
    }

    location = /doc {
        return 301 /docs/;
    }

    location ^~ /doc/ {
        rewrite ^/doc/?(.*)$ /docs/$1 break;
        proxy_pass http://sub2api_frontend_docs;
    }

    location ^~ /docs {
        proxy_pass http://sub2api_frontend_docs;
    }

    location ^~ /assets/ {
        proxy_pass http://sub2api_frontend_docs;
    }

    location ^~ /img/ {
        proxy_pass http://sub2api_frontend_docs;
    }

    location = /sitemap.xml {
        proxy_pass http://sub2api_frontend_docs;
    }

    # --- App SPA (frontend_self) ---
    location = /setup {
        proxy_pass http://sub2api_frontend_self;
    }

    location ^~ /app-assets/ {
        proxy_pass http://sub2api_frontend_self;
    }

    location / {
        proxy_pass http://sub2api_frontend_self;
    }
}
